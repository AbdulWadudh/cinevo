# Local rehearsal of the production image. Coolify doesn't use this file — point
# it at the Dockerfile build pack instead (README → "Deploy with Docker / Coolify").
#
#   docker compose up --build      # http://localhost:3000
#
# The build args below are the ones next build inlines into the client bundle, so
# they're passed at build time exactly as they will be in production; everything
# else is read from .env at run time.

services:
  cinevo:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        TMDB_API_KEY: ${TMDB_API_KEY}
        TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
    env_file: .env
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    restart: unless-stopped
